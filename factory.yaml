name: ai-eng
factory_dir: .factory
variables:
  stack_root: .
  worktree: ${execution.factory_dir}/worktrees/${execution.id}
  project_subdir: .
  workspace: ${variables.worktree}/${variables.project_subdir}
packages:
  - name: task_intake
    protocol: mcp
    path: ${variables.stack_root}/agents/task_intake
    entrypoint: start.sh
    args:
      - --workspace
      - ${variables.workspace}
    runtime:
      name: pi
      version: =1.0.3
    overrides:
      provider: openrouter
      model: deepseek/deepseek-v4-flash
      base_url: https://openrouter.ai/api/v1
      api: openai-completions
      api_key_env: OPENROUTER_API_KEY
      thinking: high
      model_config:
        name: DeepSeek V4 Flash
        reasoning: true
        context_window: 1048576
        max_tokens: 16384
        input:
          - text
        cost:
          input: 0
          output: 0
          cache_read: 0
          cache_write: 0
  - name: investigator
    protocol: mcp
    path: ${variables.stack_root}/agents/investigator
    entrypoint: start.sh
    args:
      - --workspace
      - ${variables.workspace}
    runtime:
      name: pi
      version: =1.0.3
    overrides:
      provider: openrouter
      model: deepseek/deepseek-v4-flash
      base_url: https://openrouter.ai/api/v1
      api: openai-completions
      api_key_env: OPENROUTER_API_KEY
      thinking: high
      model_config:
        name: DeepSeek V4 Flash
        reasoning: true
        context_window: 1048576
        max_tokens: 16384
        input:
          - text
        cost:
          input: 0
          output: 0
          cache_read: 0
          cache_write: 0
  - name: readiness
    protocol: mcp
    path: ${variables.stack_root}/classifiers/task-readiness
    entrypoint: start.sh
    overrides:
      provider: openrouter
      endpoint: https://openrouter.ai/api/alpha/decisions
      model: typesafe/jev-1.14
      api_key_env: OPENROUTER_API_KEY
      timeout_ms: 20000
      max_request_bytes: 24000
      max_response_bytes: 24000
      admission:
        minimum_probability: 0.85
  - name: architect
    protocol: mcp
    path: ${variables.stack_root}/agents/architect
    entrypoint: start.sh
    args:
      - --workspace
      - ${variables.workspace}
    runtime:
      name: pi
      version: =1.0.3
    overrides:
      provider: openrouter
      model: deepseek/deepseek-v4-flash
      base_url: https://openrouter.ai/api/v1
      api: openai-completions
      api_key_env: OPENROUTER_API_KEY
      thinking: high
      model_config:
        name: DeepSeek V4 Flash
        reasoning: true
        context_window: 1048576
        max_tokens: 16384
        input:
          - text
        cost:
          input: 0
          output: 0
          cache_read: 0
          cache_write: 0
  - name: architecture_reviewer
    protocol: mcp
    path: ${variables.stack_root}/agents/architecture_reviewer
    entrypoint: start.sh
    args:
      - --workspace
      - ${variables.workspace}
    runtime:
      name: pi
      version: =1.0.3
    overrides:
      provider: openrouter
      model: deepseek/deepseek-v4-flash
      base_url: https://openrouter.ai/api/v1
      api: openai-completions
      api_key_env: OPENROUTER_API_KEY
      thinking: high
      model_config:
        name: DeepSeek V4 Flash
        reasoning: true
        context_window: 1048576
        max_tokens: 16384
        input:
          - text
        cost:
          input: 0
          output: 0
          cache_read: 0
          cache_write: 0
  - name: implementer
    protocol: mcp
    path: ${variables.stack_root}/agents/coder_golang
    entrypoint: start.sh
    args:
      - --workspace
      - ${variables.workspace}
    runtime:
      name: pi
      version: =1.0.3
    overrides:
      provider: openrouter
      model: deepseek/deepseek-v4-flash
      base_url: https://openrouter.ai/api/v1
      api: openai-completions
      api_key_env: OPENROUTER_API_KEY
      thinking: medium
      model_config:
        name: DeepSeek V4 Flash
        reasoning: true
        context_window: 1048576
        max_tokens: 16384
        input:
          - text
        cost:
          input: 0
          output: 0
          cache_read: 0
          cache_write: 0
  - name: code_reviewer
    protocol: mcp
    path: ${variables.stack_root}/agents/code_reviewer_golang
    entrypoint: start.sh
    args:
      - --workspace
      - ${variables.workspace}
    runtime:
      name: pi
      version: =1.0.3
    overrides:
      provider: openrouter
      model: deepseek/deepseek-v4-flash
      base_url: https://openrouter.ai/api/v1
      api: openai-completions
      api_key_env: OPENROUTER_API_KEY
      thinking: high
      model_config:
        name: DeepSeek V4 Flash
        reasoning: true
        context_window: 1048576
        max_tokens: 16384
        input:
          - text
        cost:
          input: 0
          output: 0
          cache_read: 0
